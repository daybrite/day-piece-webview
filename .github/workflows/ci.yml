name: ci

# Four questions, answered on every push and once a day:
#   host        does the crate build, lint, and pass its tests, with each desktop toolkit's arm
#               compiled in on a host that has that toolkit's web engine?
#   cross-check do the mobile and web arms compile for their targets?
#   renderer-comparison do native and Servo pages pass and produce matched captures?
#   demo        do the walkthroughs pass on all eight primary platform-toolkit pairs,
#               against day's newest main?
#
# No Cargo.lock is committed, here or in demo/: this crate tracks an unpublished framework by
# its bare git URL, so every run resolves day afresh at the tip of main and proves the crate
# against it. A red run after a day push is the signal, not a nuisance, and there is no pinned
# lock for a local `day patch` table to rewrite and commit by accident.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: day's main moves on weeks nobody pushes here.
    - cron: "0 11 * * *"

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  # One row per desktop toolkit, because each links a different engine: WebKitGTK 6 and Qt
  # WebEngine on Linux, WKWebView through objc2 on macOS, and WebView2 through the XAML shim on
  # Windows (build.rs fetches the pinned WebView2 SDK package there). The feature-less clippy and
  # the tests cover the front end: the JavaScript envelope, the reply codec, and the link policy.
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: gtk }
          - { os: ubuntu-latest, features: qt }
          - { os: macos-15, features: appkit }
          - { os: xcode-27, features: appkit }
          - { os: windows-latest, features: winui }
          - { os: windows-latest, features: xaml }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the toolkit and web engine libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          case "${{ matrix.features }}" in
            gtk) sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config ;;
            qt) sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-webengine-dev pkg-config ;;
          esac
      - run: cargo fmt --all -- --check
        if: matrix.features == 'gtk'
      - run: cargo fmt --manifest-path servo/Cargo.toml --all -- --check
        if: matrix.features == 'gtk'
      - name: Verify native consumer dependency isolation
        if: matrix.features == 'gtk'
        run: python3 scripts/check-native-resolution.py
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features ${{ matrix.features }} -- -D warnings
      - run: cargo test
      - name: Test AppKit renderer registration
        if: matrix.features == 'appkit'
        run: cargo test --features appkit --lib
      - name: Test Qt WebView startup lifecycle
        if: matrix.features == 'qt'
        run: |
          cmake -S tests/qt -B target/qt-tests
          cmake --build target/qt-tests
          ctest --test-dir target/qt-tests --output-on-failure
      - name: Test Windows evaluation payload conversion
        if: runner.os == 'Windows'
        run: |
          cmake -S tests/xaml -B target/xaml-tests
          cmake --build target/xaml-tests --config Release
          ctest --test-dir target/xaml-tests -C Release --output-on-failure
      - uses: actions/setup-node@v6
        if: matrix.features == 'gtk'
        with:
          node-version: '22'
      - run: node --test tests/*.mjs
        if: matrix.features == 'gtk'
      - run: python3 -m unittest discover -s scripts -p test_renderer_comparison.py -v
        if: matrix.features == 'gtk'

  # The mobile and web arms compile for their targets. A link is not attempted here (the demo
  # below does that inside a real app), but an objc2 call that no longer type-checks, a JNI
  # signature drift in the Android arm, or a wasm-only API change fails here in a minute.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios-sim, features: uikit }
          - { os: ubuntu-latest, target: aarch64-linux-android, features: mdc }
          # The getrandom backend cfg is what `day build` sets for every web app; without it
          # getrandom refuses to compile for wasm32-unknown-unknown.
          - { os: ubuntu-latest, target: wasm32-unknown-unknown, features: dom, rustflags: '--cfg getrandom_backend="custom"' }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v5
        if: matrix.features == 'mdc'
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Android resource content-type handling
        if: matrix.features == 'mdc'
        run: |
          javac -d target/android-resource-tests src/DayWebContentType.java tests/android/ContentTypeTest.java
          java -cp target/android-resource-tests dev.daybrite.day.piece.webview.ContentTypeTest
      - run: cargo clippy --target ${{ matrix.target }} --features ${{ matrix.features }} -- -D warnings

  # Only implemented Servo hosts belong here. Both engines render the same fixtures in one
  # process; the ordinary native-only matrix below still tests every supported toolkit.
  renderer-comparison:
    name: renderer comparison (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, target: macos-appkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: daybrite/actions/.github/actions/setup-day-cli@v1
      - uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.target }}
          pack: false
          extras: true
          packages: python@3.12 llvm
      - name: Configure Servo build tools
        shell: bash
        run: |
          echo "DAY_BUILD_TOOL_PATH=$(brew --prefix python@3.12)/libexec/bin:$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo -> build/day/flavors/servo/cargo/${{ matrix.target }}/debug
          shared-key: servo-${{ matrix.target }}
      - name: Run mixed-renderer regression and comparison scripts
        working-directory: demo
        env:
          DAY_LOG: warn
          DAY_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          "$DAY_BIN" launch -t "$DAY_TARGET" --flavor servo --script experiments/servo.yaml
          "$DAY_BIN" launch -t "$DAY_TARGET" --flavor servo --script experiments/renderer-comparison.yaml
      - name: Verify matched captures
        run: python3 scripts/verify-renderer-comparison.py demo/build/day/flavors/servo/screenshots --target '${{ matrix.target }}'
      # The shared workflow consumes screenshots-* in both its website and release archive.
      # Unique shot names avoid overwriting native screenshots at the same target/variant path.
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-renderer-comparison-${{ matrix.target }}
          path: demo/build/day/flavors/servo/screenshots/
          if-no-files-found: error
      - name: Upload script diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-comparison-reports-${{ matrix.target }}
          path: demo/build/day/flavors/servo/reports/dayscript/
          if-no-files-found: warn

  # The proof: the demo app, driven end to end by the shared Day workflow. It builds against day's
  # newest main, runs dayscript/webview.yaml, and fails on a failed assertion or a blank capture.
  # The script loads a site bundled with the app, so no step waits on the network. Screenshots are
  # uploaded per target, and a tag build attaches them to the release.
  demo:
    # Ensures comparison captures exist before the reusable workflow assembles the website.
    needs: renderer-comparison
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # project website, screenshots, and web demo
      id-token: write # deploy-pages OIDC token
    secrets: inherit
    with:
      project-path: demo
      targets: macos-appkit, linux-gtk, linux-qt, windows-winui, ios-uikit, android-mdc,
        harmony-arkui, web-dom
      target-packages: |
        windows-winui: webview2-runtime
      update-day-deps: true
      scripts: dayscript/webview.yaml
      preflight-checks: fmt, clippy, test
      # website/site.toml opts into daysite: landing page, gallery, and /webapp/.
      deploy-web: true
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait

  # The same walkthrough paints a marker on every target. Checking the Harmony captures
  # separately catches a working JS engine with a blank GPU surface, without a second suite.
  harmony-rendering:
    needs: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-harmony-arkui*
          path: harmony-screenshots
          merge-multiple: true
      - run: python3 -m pip install 'Pillow==11.3.0'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/verify-webview-render.py harmony-screenshots

name: servo-remote
description: Render daybrite.dev with both engines in one process.
flow:
  - tap: { id: webview-settings }
  - select: { id: webview-default-renderer, index: 0 }
  - toggle: { id: webview-incognito, value: false }
  - toggle: { id: webview-native-tabs, value: false }
  - tap: { id: webview-settings-done }
  - tap: { id: webview-tools }
  - toggle: { id: tab-controls, value: true }
  - tap: { id: tab-new }
  - input: { id: webview-address-tab-2, text: "https://daybrite.dev" }
  - tap: { id: webview-go-tab-2 }
  - web_eval: { id: webview-tab-2, script: "location.origin + ' ' + document.readyState", text: "https://daybrite.dev complete", timeout_secs: 90 }
  - web_eval: { id: webview-tab-2, script: "window.rendererFixture = 'native'; navigator.userAgent.includes('Servo')", text: "false" }
  - screenshot: { name: daybrite-webview, title: "daybrite.dev in WKWebView" }
  - tap: { id: tab-new-tab-2 }
  - tap: { id: webview-renderer-tab-3 }
  - web_eval: { id: webview-tab-3, script: "document.readyState", text: "complete", timeout_secs: 30 }
  - input: { id: webview-address-tab-3, text: "https://daybrite.dev" }
  - tap: { id: webview-go-tab-3 }
  - web_eval: { id: webview-tab-3, script: "location.origin + ' ' + document.readyState", text: "https://daybrite.dev complete", timeout_secs: 90 }
  - web_eval: { id: webview-tab-3, script: "navigator.userAgent.includes('Servo') && document.body.innerText.length > 100", text: "true" }
  - screenshot: { name: daybrite-servo, title: "daybrite.dev in Servo" }
  - tap: { id: tab-previous-tab-3 }
  - web_eval: { id: webview-tab-2, script: "window.rendererFixture", text: "native" }
  - tap: { id: tab-next-tab-2 }
  - tap: { id: webview-settings-tab-3 }
  - select: { id: webview-default-renderer, index: 1 }
  - tap: { id: webview-settings-done }
  - tap: { id: tab-new-tab-3 }
  - assert_text: { id: webview-renderer-tab-4, key: renderer_servo }
  - web_eval: { id: webview-tab-4, script: "navigator.userAgent.includes('Servo')", text: "true", timeout_secs: 30 }
  - tap: { id: webview-settings-tab-4 }
  - select: { id: webview-default-renderer, index: 0 }
  - toggle: { id: webview-native-tabs, value: true }
  - tap: { id: webview-settings-done }
  - tap: { id: tab-close-tab-4 }
  - web_eval: { id: webview-tab-3, script: "location.origin + ' ' + navigator.userAgent.includes('Servo')", text: "https://daybrite.dev true" }
  - tap: { id: tab-previous-tab-3 }
  - web_eval: { id: webview-tab-2, script: "window.rendererFixture", text: "native" }
  - assert_no_placeholders: {}

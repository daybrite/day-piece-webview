# The x86_64 Oniro image lacks usable ArkWeb libraries. Verify the explicit fallback instead
# of mounting a Web surface that can stall the compositor. Real devices use webview.yaml.
name: harmony-emulator
description: Check that the HarmonyOS emulator explains its missing web engine and stays responsive.
flow:
  - wait_for: { id: webview-title }
  - assert_text: { id: webview-support, key: support_unsupported }
  - assert_text: { id: webview-inline-support, key: support_unsupported }
  - assert_text: { id: webview-eval-support, key: support_unsupported }
  - assert_missing: { id: webview }
  - assert_text: { id: webview-unsupported, key: site_emulator_unsupported }
  - input: { id: webview-js, text: "document.title" }
  - assert_text: { id: webview-js, text: "document.title" }
  - screenshot: { name: webview, title: "Bundled site", caption: "The HarmonyOS emulator has no ArkWeb engine; device builds use the native web view." }

name: browser-privacy
description: Experiment with native profiles, private storage isolation, and returning to the persistent browser.
flow:
  - wait_for: { id: webview }
  - web_eval: { id: webview, script: 'localStorage.setItem("privacy-fixture","persistent"); "saved"', text: 'saved' }
  - tap: { id: webview-settings }
  - wait_for: { id: webview_incognito }
  - screenshot: browser-settings
  - toggle: { id: webview_incognito, value: true }
  - tap: { id: webview_settings_done }
  - web_eval: { id: webview, script: 'localStorage.getItem("privacy-fixture")', text: 'null' }
  - web_eval: { id: webview, script: 'localStorage.setItem("privacy-fixture","private"); "saved"', text: 'saved' }
  - tap: { id: webview-settings }
  - toggle: { id: webview_incognito, value: false }
  - tap: { id: webview_settings_done }
  - web_eval: { id: webview, script: 'localStorage.getItem("privacy-fixture")', text: 'persistent' }
  - screenshot: browser-persistent-restored
  - tap: { id: webview-settings }
  - tap: { id: webview_clear_data }
  - assert_text: { id: webview_data_result, key: data_cleared, timeout_secs: 20 }
  - tap: { id: webview_settings_done }
  - web_eval: { id: webview, script: 'localStorage.getItem("privacy-fixture")', text: 'null' }
  - tap: { id: webview-settings }
  - screenshot: browser-settings-cleared

# Synthetic markers verify that switching and reordering preserve the native page.
name: tabs
description: Open, reorder, switch and close independent browser tabs.
flow:
  - web_eval: { id: webview, script: "window.tabFixtureMarker = 123", text: "123", timeout_secs: 30 }
  # The tab buttons are a testing aid, hidden until the drawer's switch shows them.
  - tap: { id: webview_tools }
  - toggle: { id: tab_controls, value: true }
  - tap: { id: tab_new }
  - wait_for: { id: webview_tab:2 }
  - web_eval: { id: webview_tab:2, script: "typeof window.tabFixtureMarker", text: "undefined", timeout_secs: 30 }
  - tap: { id: tab_move_before_tab:2 }
  - assert_visible: { id: webview_tab:2 }
  - tap: { id: tab_next_tab:2 }
  - web_eval: { id: webview, script: "window.tabFixtureMarker", text: "123" }
  - tap: { id: tab_close }
  - assert_visible: { id: webview_tab:2 }
  - tap: { id: tab_close_tab:2 }
  - wait_for: { id: webview_tab:3 }
  - assert_no_placeholders: {}

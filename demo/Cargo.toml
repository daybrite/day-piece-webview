[package]
name = "webview-demo"
version = "0.1.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
servo = ["dep:day-piece-webview-servo", "day-piece-webview-servo/servo"]
appkit = ["day/appkit", "day-piece-webview-servo?/appkit"]
gtk = ["day/gtk", "day-piece-webview-servo?/gtk"]
qt = ["day/qt", "day-piece-webview-servo?/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc", "day-piece-webview-servo?/mdc"]
xaml = ["day/xaml", "day-piece-webview-servo?/xaml"]
winui = ["day/winui", "day-piece-webview-servo?/winui"]
arkui = ["day/arkui", "day-piece-webview-servo?/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
futures-util = "0.3"
percent-encoding = "2"
url = "2"
serde_json = "1"
# The bare canonical URL, no ref: CI resolves a fresh lock against day's newest main (no lock is
# committed). See ../Cargo.toml for why a ref would double the graph.
day = { git = "https://github.com/daybrite/day.git" }
# The piece under test, by path: a change to the piece and to the demo land in one pull request
# and one CI run. `day build` enables the piece's backend feature for each target. An app
# depends on it from git instead:
#     day-piece-webview = { git = "https://github.com/daybrite/day-piece-webview.git" }
day-piece-webview = { path = ".." }
day-piece-webview-servo = { path = "../servo", optional = true, default-features = false }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[workspace]

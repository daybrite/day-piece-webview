[package]
name = "webview-demo"
version = "0.1.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
servo = ["dep:day-piece-webview-servo", "day-piece-webview-servo/servo"]
appkit = ["day/appkit", "day-piece-webview-servo?/appkit"]
gtk = ["day/gtk", "day-piece-webview-servo?/gtk"]
qt = ["day/qt", "day-piece-webview-servo?/qt"]
uikit = ["day/uikit"]
material = ["day/material", "day-piece-webview-servo?/material"]
xaml = ["day/xaml", "day-piece-webview-servo?/xaml"]
winui = ["day/winui", "day-piece-webview-servo?/winui"]
arkui = ["day/arkui", "day-piece-webview-servo?/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
futures-util = "0.3"
percent-encoding = "2"
url = "2"
serde_json = "1"
# The bare canonical URL, no ref: CI resolves a fresh lock against day's newest main (no lock is
# committed). See ../Cargo.toml for why a ref would double the graph.
day = { package = "day-app", version = "0.*" }
# The piece under test, by path: a change to the piece and to the demo land in one pull request
# and one CI run. `day build` enables the piece's backend feature for each target. An app
# depends on it from git instead:
#     day-piece-webview = "0.*"
day-piece-webview = { version = "0.*", path = ".." }
day-piece-webview-servo = { version = "0.*", path = "../servo", optional = true, default-features = false }

[build-dependencies]
day-build = "0.*"

[workspace]

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"

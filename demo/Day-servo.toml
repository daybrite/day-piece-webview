[app]
# harmony-arkui is paused: see docs/servo.md, "Paused: OpenHarmony", for what has to change
# upstream before it returns here and to the CI comparison matrix.
targets = ["macos-appkit", "macos-gtk", "macos-qt", "linux-gtk", "linux-qt", "windows-winui", "android-material"]

[cargo]
features = ["servo"]

[env]
# Servo 0.6's published SpiderMonkey archive contains macOS 15.5 objects.
MACOSX_DEPLOYMENT_TARGET = "15.5"

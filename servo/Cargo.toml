[package]
name = "day-piece-webview-servo"
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
description = "Experimental Servo renderer for day-piece-webview"
repository = "https://github.com/daybrite/day-piece-webview"
license = "MPL-2.0"

[features]
default = []
servo = ["dep:servo", "dep:raw-window-handle", "dep:dpi", "dep:euclid", "dep:rustls", "dep:pkcs1", "dep:http", "dep:tempfile", "dep:image", "dep:rustls-platform-verifier", "dep:rustls-platform-verifier-android", "dep:servo-default-resources"]
gtk = ["day-piece-webview/gtk"]
qt = ["day-piece-webview/qt"]
xaml = ["day-piece-webview/xaml"]
winui = ["xaml", "day-piece-webview/winui"]
material = ["day-piece-webview/material", "dep:day-toolkit-material", "dep:day-platform-android"]
arkui = ["day-piece-webview/arkui"]
appkit = ["day-piece-webview/appkit", "dep:day-toolkit-appkit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
day-piece-webview = { path = "..", version = "0.4" }
day-spec = "0.6"
day-core = "0.6"
day-reactive = "0.6"
serde_json = "1"
url = "2"
log = "0.4"

[package.metadata.day]
compat = "0.6"

[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "xaml", "winui", "material", "arkui"]

[package.metadata.day.macos]
selective-archive-loading = { feature = "servo" }
libraries = [{ name = "c++", feature = "servo" }, { name = "z", feature = "servo" }]
# SpiderMonkey uses tagged static pointers that chained dyld fixups cannot represent.
linker-options = [{ name = "-no_fixup_chains", feature = "servo" }]

# Resolve this experimental package independently from the native piece.
[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android"))'.dependencies]
servo = { version = "=0.6.0", optional = true, default-features = false, features = ["bundled", "js_jit", "webcrypto"] }
# Servo's RSA prerelease is incompatible with pkcs1 rc.5; match Servo 0.6's lockfile.
pkcs1 = { version = "=0.8.0-rc.4", optional = true }
http = { version = "1.4", optional = true }
tempfile = { version = "3", optional = true }
raw-window-handle = { version = "0.6", optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
day-toolkit-appkit = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSURL", "NSURLRequest", "NSError"] }

# Hosted Windows runners need ANGLE/D3D rather than the system's legacy OpenGL driver.
[target.'cfg(windows)'.dependencies]
servo = { version = "=0.6.0", optional = true, default-features = false, features = ["bundled", "js_jit", "webcrypto", "no-wgl"] }

# Servo links its baked-in resource reader (servo-default-resources, feature `baked-in-resources`)
# on every platform but OpenHarmony, where it expects the embedder to register one; without a
# reader the constellation panics at startup ("No resource reader registered"). Take the default
# reader directly there; `use … as _` in engine.rs is what keeps it linked.
[target.'cfg(target_env = "ohos")'.dependencies]
servo-default-resources = { version = "=0.6.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
day-toolkit-material = { version = "0.6", optional = true }
day-platform-android = { version = "0.6", optional = true }
rustls-platform-verifier = { version = "=0.7.1", optional = true }
# Keep the Kotlin AAR and Rust package on the same ABI version.
rustls-platform-verifier-android = { version = "=0.2.0", optional = true }

[package.metadata.day.android]
# SpiderMonkey encodes native pointers in JS values and cannot accept Android heap tags.
disable-native-heap-pointer-tagging = { feature = "servo" }
gradle-dependencies = [{ name = "org.rustls:rustls-platform-verifier:0.2.0", feature = "servo" }]
gradle-repositories = [{ name = "https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/", feature = "servo" }]

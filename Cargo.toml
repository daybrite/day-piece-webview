[package]
name = "day-piece-webview"
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
description = "An embedded native web view for Day apps: remote pages and bundled sites"
repository = "https://github.com/daybrite/day-piece-webview"
license = "MPL-2.0"
# The day framework crates are not on crates.io yet; neither is this one. Apps depend on it
# from git, exactly as they depend on day.
publish = false
build = "build.rs"

# An external Day Piece (https://daybrite.dev/docs/extending) wrapping each toolkit's native web
# view: WKWebView on AppKit/UIKit, QWebEngineView on Qt, android.webkit.WebView on Android, WebKitGTK
# on GTK, WebView2 on XAML, ArkWeb on HarmonyOS, and an <iframe> on the web. It carries both its
# cross-platform front-end (Rust) and its per-toolkit backend (objc2 / C++ shims / Android Java /
# ArkTS / gtk-rs) without touching any day crate. See docs/webview.md.
#
# Every day dependency names the bare canonical URL: no branch, tag, or rev. Cargo unifies a git
# dependency only when URL and ref match, so an app on `git = "…/day.git"` and a piece pinned to
# a tag would carry two copies of every day crate; leaving the ref off lets the app's Cargo.lock
# choose one revision for the whole graph. No lock is committed here (see .gitignore), and
# `compat` below says which day minor this release is built and tested against.

[features]
appkit = ["dep:day-appkit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-core-foundation", "dep:objc2-web-kit", "dep:block2"]
# GTK uses WebKitGTK on Linux, WKWebView on macOS, and WebView2 through Wry on Windows.
gtk = ["dep:wry", "dep:serde_json", "dep:url", "dep:day-gtk", "dep:gtk4", "dep:webkit6", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-core-foundation", "dep:objc2-web-kit", "dep:block2"]
qt = ["dep:day-qt", "dep:wry", "dep:serde_json", "dep:url"]                 # + build.rs compiles src/lib-qt-shim.cpp, linking Qt6WebEngineWidgets when present (else a URL-label fallback)
# objc2-web-kit 0.3 binds WKWebView for macOS only, so UIKit hand-rolls it via extern_class!/msg_send!.
uikit = ["dep:day-uikit", "dep:objc2", "dep:objc2-ui-kit", "dep:objc2-foundation", "dep:objc2-core-foundation", "dep:block2"]
mdc = ["dep:day-android"]        # + [package.metadata.day.android]
xaml = ["dep:day-xaml", "dep:day-xaml-sys"]     # + build.rs compiles src/lib-xaml-shim.cpp
# The ArkUI C node API has no Web node, so this backend is the crate's ArkTS half
# (platform/harmony/ets/Index.ets) staged by `day build`, and it needs no Rust dependency beyond
# the toolkit.
arkui = ["dep:day-arkui"]        # + [package.metadata.day.ohos]
# Web: an <iframe>. Registered at runtime rather than link-time: wasm has no `linkme` distributed
# slice (see lib-dom.rs), so the piece registers itself from its constructor. The same-origin policy
# makes history and URL readback unreachable, so this arm is Emulated, not Native (docs/webview.md).
dom = ["dep:day-dom"]

[package.metadata.day]
# The day minor this release is built and tested against. `day build` notes a mismatch.
compat = "0.4"

# Backends this piece carries a native-renderer [features] entry for. `day` unions `<pkg>/<backend>`
# into an app build (Tier A.2), so an app depends on this piece with a plain `{ git = "…" }` line,
# with no per-backend feature fan-out in its own Cargo.toml.
[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "uikit", "mdc", "xaml", "arkui", "dom"]

[dependencies]
day-bridge = { git = "https://github.com/daybrite/day.git" }
log = "0.4"
day-spec = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-pieces = { git = "https://github.com/daybrite/day.git" }
day-reactive = { git = "https://github.com/daybrite/day.git" }
linkme = "0.3"
day-appkit = { git = "https://github.com/daybrite/day.git", optional = true }
day-gtk = { git = "https://github.com/daybrite/day.git", optional = true }
day-qt = { git = "https://github.com/daybrite/day.git", optional = true }
day-uikit = { git = "https://github.com/daybrite/day.git", optional = true }
day-android = { git = "https://github.com/daybrite/day.git", optional = true }
day-xaml = { git = "https://github.com/daybrite/day.git", optional = true }
day-xaml-sys = { git = "https://github.com/daybrite/day.git", optional = true }
day-arkui = { git = "https://github.com/daybrite/day.git", optional = true }
day-dom = { git = "https://github.com/daybrite/day.git", optional = true }
# Apple completion handlers for evaluateJavaScript (docs/webview-eval.md).
gtk4 = { version = "0.11", optional = true }

# WebKitGTK is only built on Linux. macOS/Windows have their own native hosts.
[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
webkit6 = { version = "0.6", optional = true }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }
day-toolchain = { git = "https://github.com/daybrite/day.git" }
cc = "1"

[dev-dependencies]
day-mock = { git = "https://github.com/daybrite/day.git" }

# Standalone-piece Android contribution (https://daybrite.dev/docs/extending). The day CLI reads
# this from `cargo metadata` and folds it into the app's Gradle build: the piece carries its
# backend Java and declares the Android permissions it needs, without touching day-android or the
# scaffold.
[package.metadata.day.android]
# Java/Kotlin sources, relative to this crate root: dirs, or single files linked in by package.
java = ["src/DayWebView.java"]
# Gradle dependency coordinates added to the app module. android.webkit.WebView is a framework
# widget, so no extra dependency is required.
gradle-dependencies = []
# Extra Maven repositories (URLs) for dependencies not on google()/mavenCentral().
gradle-repositories = []
# Android manifest <uses-permission>s the piece needs, merged into the app manifest by `day build`
# (the enhancement this piece motivates: a standalone piece can now contribute a permission).
permissions = ["android.permission.INTERNET"]

# --- HarmonyOS backend contribution (https://daybrite.dev/docs/extending) ---
# The ArkTS half of this piece: `day build -p harmony-arkui` stages these into the app's hvigor
# project and generates the aggregator that registers `dayPiece` with the native shim. Each dir
# needs an `Index.ets` exporting a `DayPieceModule`. This `ets` key is the extension point this
# piece motivates, the HarmonyOS counterpart of the android `java` contribution above.
[package.metadata.day.ohos]
ets = ["platform/harmony/ets"]

# --- iOS backend contribution (https://daybrite.dev/docs/extending) ---
# The iOS WKWebView is hand-rolled in Rust (objc2), so there's no Swift shim, but WKWebView's ObjC
# class lives in WebKit.framework, which the app must link. Declaring it here (the `frameworks` key)
# links it via the generated DayPieces SwiftPM package, replacing the earlier runtime `dlopen`.
[package.metadata.day.ios]
frameworks = ["WebKit"]

# --- macOS backend contribution ---
# The same framework for the appkit leg. objc2-web-kit's own `#[link]` sits on an empty extern
# block, so the flag never reaches the Xcode link of the app's staticlib, and WKWebView resolves
# at run time only if something else in the app happened to load WebKit. A one-page app with
# nothing else (demo/) panics with "class WKWebView could not be found" without this line.
[package.metadata.day.macos]
frameworks = ["WebKit"]

# --- AppImage launcher default (docs/extending.md) ---
# WebKitGTK runs its web and network processes inside a bubblewrap sandbox. Bubblewrap asks the
# kernel to bring up loopback in a fresh network namespace, which needs CAP_NET_ADMIN there, and
# Ubuntu 24.04's `kernel.apparmor_restrict_unprivileged_userns` grants that only to binaries with
# an AppArmor profile. A distro's own `/usr/libexec/webkit2gtk-6.0/*` has one; the same helper
# unpacked at a random path inside an AppImage does not, so bwrap fails with "loopback: Failed
# RTM_NEWADDR" and WebKit's IPC then aborts the whole app ("failed to receive credentials") the
# moment a page loads. Skipping the sandbox is the documented escape hatch and what other
# WebKitGTK AppImages do; it applies to the AppImage alone, never to a distro or Flatpak build
# (flatpak.rs reads none of this), and a value the user already set still wins.
[[package.metadata.day.appimage.env]]
toolkit = "gtk"
name = "WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS"
value = "1"

# Qt's Flatpak runtime does not include its browser engine. Only bundle this base when
# the executable actually links the engine; builds using the URL-label fallback stay small.
[[package.metadata.day.flatpak.bases]]
toolkit = "qt"
library-prefix = "libQt6WebEngine"
id = "io.qt.qtwebengine.BaseApp"
# The base version follows Day's selected Qt runtime version.

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSView", "NSResponder"] }
objc2-ui-kit = { version = "0.3", optional = true, features = ["UIView", "UIResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSURL", "NSURLRequest", "NSError"] }
objc2-core-foundation = { version = "0.3", optional = true, features = ["CFCGTypes"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKWebViewConfiguration", "WKNavigationDelegate", "WKNavigation", "WKNavigationAction", "WKFrameInfo", "WKError", "block2"] }

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
